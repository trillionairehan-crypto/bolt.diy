name: CI/CD

on:
  push:
  pull_request:

# Cancel in-progress runs on the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Install, Build, Typecheck, Lint, Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9.14.4'

      # Pinned to match local dev (node -v), not the older default some other workflows in this
      # repo still use — keep this in sync if the local Node version changes.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # functions/[[path]].ts does `import('../build/server')` (the Remix/Cloudflare Pages
      # server bundle), which tsc statically resolves even though the result is cast — so a
      # clean checkout fails typecheck unless build has already produced build/server. Build
      # has to run before typecheck for that reason (verified via a clean git-worktree repro
      # 2026-09-04, not just a CI-vs-local guess).
      - name: Build
        run: pnpm run build

      - name: Cache TypeScript compilation
        uses: actions/cache@v4
        with:
          path: |
            .tsbuildinfo
            node_modules/.cache
          key: ${{ runner.os }}-typescript-${{ hashFiles('**/tsconfig.json', 'app/**/*.ts', 'app/**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-typescript-

      - name: Run type check
        run: pnpm run typecheck

      - name: Cache ESLint
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/eslint
          key: ${{ runner.os }}-eslint-${{ hashFiles('.eslintrc*', 'app/**/*.ts', 'app/**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-eslint-

      - name: Run ESLint
        run: pnpm run lint

      # getPlatformUserId()/buildPlatformClient() (app/lib/cloud/cloudPlatformAuth.ts) return
      # null before ever calling Supabase — including in tests that vi.mock('@supabase/supabase-js')
      # — when these two are unset, so every request looks unauthenticated (401) regardless of
      # the mocked token. They're VITE_-prefixed anon-key-style values Vite already bundles into
      # the client output, not secrets; these CI values are placeholders the mocked client never
      # actually dials out to.
      - name: Run tests
        run: pnpm run test
        env:
          VITE_PLATFORM_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_PLATFORM_SUPABASE_ANON_KEY: ci-placeholder-anon-key

      - name: Upload test coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore
