<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>coralred hero</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #FF5330; display: grid; place-items: center; min-height: 100vh; }
  .coralred-hero { position: relative; width: 512px; height: 512px; font-family: 'IBM Plex Sans KR', Helvetica, sans-serif; }
  .coralred-hero .tile {
    position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; font-size: 15px; font-weight: 700; letter-spacing: -0.01em; text-decoration: none;
    animation: cr-float ease-in-out infinite alternate;
    transition: transform .25s cubic-bezier(.34,1.56,.64,1), box-shadow .25s;
  }
  .coralred-hero .tile:hover { transform: scale(1.1) translateY(-6px); box-shadow: 0 20px 40px rgba(23,16,14,.25); }
  .coralred-hero .dot { width: 12px; height: 12px; border-radius: 6px; background: currentColor; }
  .coralred-hero .tile:nth-child(even) .dot { border-radius: 2px; }
  @keyframes cr-float { from { margin-top: -6px; } to { margin-top: 6px; } }
</style>
</head>
<body>
  <div class="coralred-hero">
    <a class="tile" href="#ai" style="left:153px;top:63px;width:104px;height:104px;border-radius:30px;background:#FAF7F0;color:#FF5330;animation-duration:3.6s;animation-delay:0s;">
      <span class="dot"></span>AI 빌더
    </a>
    <a class="tile" href="#templates" style="left:63px;top:153px;width:104px;height:104px;border-radius:30px;background:#FAF7F0;color:#FF5330;animation-duration:4.2s;animation-delay:0.6s;">
      <span class="dot"></span>템플릿
    </a>
    <a class="tile" href="#data" style="left:63px;top:255px;width:104px;height:104px;border-radius:30px;background:#FAF7F0;color:#FF5330;animation-duration:3.9s;animation-delay:1.2s;">
      <span class="dot"></span>데이터
    </a>
    <a class="tile" href="#deploy" style="left:153px;top:345px;width:104px;height:104px;border-radius:30px;background:#FAF7F0;color:#FF5330;animation-duration:4.4s;animation-delay:0.3s;">
      <span class="dot"></span>배포
    </a>
    <a class="tile" href="#integrations" style="left:289px;top:84px;width:84px;height:84px;border-radius:26px;background:#FFB5A3;color:#8F2410;animation-duration:4s;animation-delay:0.9s;font-size:13px;">
      <span class="dot"></span>연동
    </a>
    <a class="tile" href="#team" style="left:289px;top:344px;width:84px;height:84px;border-radius:26px;background:#FFB5A3;color:#8F2410;animation-duration:3.7s;animation-delay:1.5s;font-size:13px;">
      <span class="dot"></span>협업
    </a>
  </div>
</body>
</html>
